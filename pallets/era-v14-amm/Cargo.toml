[package]
name = "era-v14-amm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Dormant, policy-parametric bounded ERA V14 AMM storage kernel"

[dependencies]
codec = { workspace = true, features = ["derive", "max-encoded-len"] }
scale-info = { workspace = true, features = ["derive"] }
frame-support.workspace = true
frame-system.workspace = true
sp-runtime.workspace = true
sp-core.workspace = true
sp-io.workspace = true
sp-api.workspace = true
era-v14-application-primitives = { path = "../era-v14-application-primitives", default-features = false }

[features]
default = ["std"]
std = ["codec/std", "scale-info/std", "frame-support/std", "frame-system/std", "sp-runtime/std", "sp-core/std", "sp-io/std", "sp-api/std", "era-v14-application-primitives/std"]
# Explicit synthetic harness feature; runtime normal dependency does not enable it.
test-fixtures = ["std"]
runtime-benchmarks = ["frame-support/runtime-benchmarks", "frame-system/runtime-benchmarks"]
try-runtime = ["frame-support/try-runtime", "frame-system/try-runtime"]

[package]
name = "era-runtime"
version = "0.1.0"
edition = "2021"
publish = false
description = "Era runtime"

[lib]
name = "era_runtime"
crate-type = ["cdylib", "rlib"]

[dependencies]
# External
codec       = { workspace = true }
scale-info  = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }

# SP
sp-api.workspace = true
sp-block-builder.workspace = true
sp-consensus-babe = { features = ["serde"], workspace = true }
sp-consensus-grandpa = { features = ["serde"], workspace = true }
sp-core = { features = ["serde"], workspace = true }
sp-inherents.workspace = true
sp-offchain.workspace = true
sp-runtime = { features = ["serde"], workspace = true }
sp-session.workspace = true
sp-io.workspace = true
sp-version = { features = ["serde"], workspace = true }
sp-timestamp.workspace = true
sp-staking.workspace = true
sp-transaction-pool = { workspace = true, default-features = false }
sp-genesis-builder = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-v1.19.1", default-features = false }

# FRAME + pallets
frame-support    = { workspace = true, default-features = false }
frame-system     = { workspace = true, default-features = false }
frame-benchmarking = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-v1.19.1", default-features = false, optional = true }
frame-system-benchmarking = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-v1.19.1", default-features = false, optional = true }
frame-try-runtime = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-v1.19.1", default-features = false, optional = true }
frame-executive  = { workspace = true, default-features = false }
frame-system-rpc-runtime-api = { workspace = true, default-features = false }
frame-election-provider-support = { workspace = true, default-features = false }

pallet-timestamp           = { workspace = true, default-features = false }
pallet-balances            = { workspace = true, default-features = false }
pallet-transaction-payment = { workspace = true, default-features = false }
pallet-sudo                = { workspace = true, default-features = false }
pallet-session             = { workspace = true, default-features = false, features=["historical"] }
pallet-babe                = { workspace = true, default-features = false }
pallet-grandpa             = { workspace = true, default-features = false }
pallet-staking             = { workspace = true, default-features = false }
pallet-vesting             = { workspace = true, default-features = false }
pallet-multisig            = { workspace = true, default-features = false }
pallet-proxy               = { workspace = true, default-features = false }
pallet-assets              = { workspace = true, default-features = false }
pallet-nfts                = { workspace = true, default-features = false }
pallet-era-worlds          = { workspace = true, default-features = false }
pallet-transaction-payment-rpc-runtime-api = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-v1.19.1", default-features = false }
pallet-authorship = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-v1.19.1", default-features = false }
pallet-ai-predictions = { path = "../pallets/ai-predictions", default-features = false }
pallet-reward-reserve = { workspace = true, default-features = false }
sp-storage = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-v1.19.1", default-features = false, optional = true }

[dev-dependencies]
frame-metadata = { version = "23.0.0", features = ["current"] }

[build-dependencies]
substrate-wasm-builder = { workspace = true }

[features]
default = ["std"]
std = [
    "codec/std","scale-info/std","serde/std","serde_json/std",
    "sp-api/std","sp-core/std","sp-io/std","sp-runtime/std","sp-version/std",
    "sp-session/std","sp-staking/std","sp-inherents/std","sp-block-builder/std",
    "sp-offchain/std","sp-timestamp/std","sp-consensus-babe/std","sp-consensus-grandpa/std",
    "frame-support/std","frame-system/std","frame-executive/std","frame-system-rpc-runtime-api/std","frame-election-provider-support/std",
    "pallet-timestamp/std","pallet-balances/std","pallet-transaction-payment/std","pallet-sudo/std",
    "pallet-session/std","pallet-babe/std","pallet-grandpa/std","pallet-staking/std","pallet-vesting/std",
    "pallet-multisig/std","pallet-proxy/std","pallet-assets/std","pallet-nfts/std","pallet-era-worlds/std",
     "sp-transaction-pool/std","pallet-transaction-payment-rpc-runtime-api/std","sp-genesis-builder/std","pallet-authorship/std","pallet-ai-predictions/std","pallet-reward-reserve/std",
]

runtime-benchmarks = [
    "frame-benchmarking/runtime-benchmarks", "frame-system-benchmarking/runtime-benchmarks",
    "frame-support/runtime-benchmarks", "frame-system/runtime-benchmarks",
    "pallet-ai-predictions/runtime-benchmarks", "pallet-reward-reserve/runtime-benchmarks", "pallet-staking/runtime-benchmarks", "pallet-multisig/runtime-benchmarks", "pallet-proxy/runtime-benchmarks", "pallet-assets/runtime-benchmarks", "pallet-nfts/runtime-benchmarks", "pallet-era-worlds/runtime-benchmarks", "sp-runtime/runtime-benchmarks", "sp-storage"
]
try-runtime = ["frame-try-runtime/try-runtime", "frame-support/try-runtime", "frame-executive/try-runtime", "frame-system/try-runtime", "pallet-ai-predictions/try-runtime", "pallet-reward-reserve/try-runtime", "pallet-staking/try-runtime", "pallet-multisig/try-runtime", "pallet-proxy/try-runtime", "pallet-assets/try-runtime", "pallet-nfts/try-runtime", "pallet-era-worlds/try-runtime", "sp-runtime/try-runtime"]

metadata-hash = ["substrate-wasm-builder/metadata-hash"]
on-chain-release-build = ["metadata-hash", "sp-api/disable-logging"]

[package.metadata.substrate-wasm-builder]
wasm-target = "wasm32v1-none"
